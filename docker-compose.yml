version: '3.8'

services:
  backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-jarvis-quantum-core-super-secret-key-change-in-production-2026}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./jarvis.db}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - ENVIRONMENT=production
    volumes:
      - jarvis-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  jarvis-data:
