name: J.A.R.V.I.S. Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        run: |
          cd web/backend
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci || npm install

      - name: Verify TypeScript & Build Frontend
        run: |
          cd web/frontend
          npm run build
