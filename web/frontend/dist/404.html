<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>J.A.R.V.I.S. | Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#02040a; color:#00e5ff; font-family:monospace; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <p>INITIALIZING J.A.R.V.I.S. CONTEXT...</p>
  </body>
</html>
